{% set name = "ssubmit" %}
{% set version = "1.3.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://crates.io/api/v1/crates/{{ name }}/{{ version }}/download
  fn: "{{ name }}-{{ version }}.tar.gz"
  sha256: 3e46de24287f0ef0b164c3e82d5fcf9be9a6fb3cfc70c5421942b8f8036402b8

build:
  number: 0
  skip: true  # [win]

requirements:
  build:
    - {{ compiler('rust') }}
    - {{ compiler('c') }}
    - {{ stdlib("c") }}
    - cargo-bundle-licenses

test:
  commands:
    - ssubmit --help

about:
  home: https://github.com/mbhall88/{{ name }}
  summary: 'Submit slurm sbatch jobs without a script'
  description: |
    Submit slurm sbatch jobs without a script 
  license: Unlicense
  license_file:
    - LICENSE
    - THIRDPARTY.yml

extra:
  recipe-maintainers:
    - mbhall88
